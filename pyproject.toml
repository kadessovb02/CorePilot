[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corepilot"
version = "0.1.0"
description = "Turn project knowledge and agent histories into a local coding assistant."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "CorePilot contributors"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
mlx = ["soup-cli==0.75.2", "mlx-lm>=0.26,<0.31", "transformers>=4.51,<6", "huggingface-hub>=0.30,<2"]

[project.scripts]
corepilot = "corepilot.cli:main"

[project.urls]
Homepage = "https://github.com/kadessovb02/CorePilot"
Repository = "https://github.com/kadessovb02/CorePilot"
Issues = "https://github.com/kadessovb02/CorePilot/issues"

[tool.setuptools.packages.find]
include = ["corepilot*"]

[tool.setuptools.package-data]
corepilot = ["web/*.html", "web/*.js", "web/*.css", "examples/demo/*.py", "examples/demo/tests/*.py", "examples/demo/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "runtime", "data", "models", "adapters", "corepilot/examples"]
