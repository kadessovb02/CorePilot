name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -B benchmarks/synthetic_v1/selfcheck.py
      - run: python -B benchmarks/synthetic_v1/test_oracle.py
      - run: python scripts/check_public_tree.py
      - run: python -m build
      - run: node --check corepilot/web/app.js
